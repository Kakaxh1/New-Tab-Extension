<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Dim K Gradient in Background -->
    <linearGradient id="dimKGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Vibrant Plus Glow Gradient in Foreground -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.55"/>

  <!-- Tactical Corner Guides -->
  <path d="M 8 13 L 8 8 L 13 8" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 51 8 L 56 8 L 56 13" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 8 51 L 8 56 L 13 56" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 51 56 L 56 56 L 56 51" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Dim K in the Background -->
  <g id="dim-k" stroke="#475569" stroke-width="0.8" stroke-opacity="0.5">
    <!-- Vertical stem of K -->
    <rect x="13.5" y="13" width="9" height="38" rx="2.5" fill="url(#dimKGrad)"/>
    <!-- Upper arm of K -->
    <polygon points="21,32 38,15 49,15 28.5,33.5" fill="url(#dimKGrad)"/>
    <!-- Lower arm of K -->
    <polygon points="25.5,30 49,49 38,49 20,33.5" fill="url(#dimKGrad)"/>
  </g>

  <!-- Foreground Bright "+" Symbol with Neon Cyan/Blue Glow -->
  <g id="foreground-plus" filter="url(#neonGlow)">
    <!-- Vertical bar of + -->
    <rect x="28.5" y="16" width="7" height="32" rx="3.5" fill="url(#plusGrad)"/>
    <!-- Horizontal bar of + -->
    <rect x="16" y="28.5" width="32" height="7" rx="3.5" fill="url(#plusGrad)"/>
    <!-- Central Core Hotspot -->
    <circle cx="32" cy="32" r="3.2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
