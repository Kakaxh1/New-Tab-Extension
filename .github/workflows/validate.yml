name: Validate Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json is valid JSON');"

      - name: Check JavaScript Syntax
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            fs.readdirSync('js').filter(f => f.endsWith('.js')).forEach(f => {
              console.log('Checking js/' + f);
              execSync('node -c js/' + f);
            });
            console.log('All JS files passed syntax validation.');
          "

      - name: Verify CSS Balance
        run: |
          node -e "
            const fs = require('fs');
            ['css/main.css', 'css/widgets.css', 'css/dorks.css'].forEach(f => {
              if (fs.existsSync(f)) {
                const css = fs.readFileSync(f, 'utf8');
                const o = (css.match(/\{/g) || []).length;
                const c = (css.match(/\}/g) || []).length;
                if (o !== c) throw new Error('Brace mismatch in ' + f + ': ' + o + ' vs ' + c);
                console.log(f + ' braces balanced: ' + o);
              }
            });
          "
